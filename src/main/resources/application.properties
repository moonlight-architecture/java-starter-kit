# database settings — keep url/username/password here (not only in profile files).
# Spring Boot 4 + DevTools can bind DataSource before application-{profile}.properties.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:moonlight}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

#liquibase
spring.liquibase.change-log=classpath:liquibase/db.changelog.xml

# Mail is off by default. Set jet.mail.enabled=true and fill spring.mail.* to send email.
jet.mail.enabled=false
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.default-encoding=UTF-8

# HS256 key: Base64 of at least 32 bytes. Override with JWT_SECRET. Do not commit a real key.
secret=${JWT_SECRET:Q0hBTkdFX01FX0NIQU5HRV9NRV9DSEFOR0VfTUVfMzJCIQ==}

spring.profiles.active=dev

app.version=SC-PROJ-20240713001

USE_DOMAINS=true
ADMIN_ROLE_DOMAIN=BACK_OFFICE
ADMIN_ROLE_NAME=ADMINISTRATOR

# Blank = public /docs. Set JET_DOCS_TOKEN (or this key) to lock the UI and spec only.
jet.docs.token=${JET_DOCS_TOKEN:}

# CORS — comma-separated origins (no wildcard with credentials)
jet.cors.origins=${JET_CORS_ORIGINS:http://localhost:8080}

#Handling lazy loading
spring.jpa.open-in-view=false

# Connection pool defaults (resource-aware for a starter)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# HTTP compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
